services:
  postgres :
    image : "postgres:16-alpine"
    container_name : "postgres"
    environment :
      POSTGRES_USER: ${POSTGRE_USER}
      POSTGRES_PASSWORD: ${POSTGRE_PASS}
      POSTGRES_DB: ${POSTGRE_DB}
    ports : 
      - "5432:5432"
  redis :
    image : "redis:7-alpine"
    container_name : "redis"
    ports:
      - "6379:6379"
